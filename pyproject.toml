[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droptrace"
version = "0.1.0"
description = "Continuous ping / download / upload monitoring with a live web dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/alencarrh/droptrace"
Issues = "https://github.com/alencarrh/droptrace/issues"

[project.scripts]
droptrace = "droptrace.__main__:main"

[tool.setuptools]
packages = ["droptrace"]

[tool.setuptools.package-data]
droptrace = ["static/*", "static/*/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
